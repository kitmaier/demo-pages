<html>
<body>
	<b>Ladybug Puzzle</b>
	<p/>
	<label for="number_of_positions">Number of positions (3-30):</label>
	<input type="number" id="number_of_positions" name="number_of_positions" min="3" max="30" value="12" onchange="numberOfPositionsChangedEvent(event)"/>
	<p/>
	<label id="estimated_expected_positional_probability">Expected outcome: The probability of each position aside from the starting position being the final position is 1/(N-1) = 1/11 = 9.1%</label>
	<p/>
	Simulated average result:
	<p/>
	<svg id="svg1"></svg>
	<p/>
	<b>Example</b>
	<p/>
	<input id="run_example_again" type="button" value="Run Again" onclick="runExampleAgain();" />
	<p/>
	<svg id="svg2"></svg>
</body>
<script>
	let numberOfPositions = 12;
	let timeoutID = -1;
	function simulateSingleResult(n) {
		let ladybug = 0;
		let filled = [];
		for(let k=0; k<n; k++) {
			filled.push(0);
		}
		filled[0] = 1;
		let count = 1;
		while(true) {
			if(Math.random()>0.5) {
				ladybug = (ladybug+1)%n;
			} else {
				ladybug = (ladybug+n-1)%n;
			}
			if(filled[ladybug]==0) {
				count++;
				filled[ladybug] = 1;
			}
			if(count==n) break;
		}
		return ladybug;
	}
	function simulateAverageResult(n) {
		let results = [];
		for(let k=0; k<n; k++) {
			results.push(0);
		}
		// TODO: optimize number of iterations
		let numIterations = 100*n*n;
		for(let k=0; k<numIterations; k++) {
			let result = simulateSingleResult(n);
			results[result]++;
		}
		for(let k=0; k<n; k++) {
			// results as percentages
			results[k] = (results[k]*100.0/numIterations).toFixed(1);
		}
		return results;
	}
	function updateImage1(n) {
		let results = simulateAverageResult(n);
		let svg = document.getElementById("svg1");
		let width = 600;
		let height = 600;
		let w = width/2.0;
		let h = height/2.0;
		let r = Math.min(w,h)*(0.7);
		svg.setAttribute("width",width);
		svg.setAttribute("height",height);
		svg.replaceChildren(); // Clears all interior content
		let svgNamespace = "http://www.w3.org/2000/svg";
		for(let i=0.0; i<n; i++) {
			// draw clock positions
			let x = h+r*Math.sin(2*Math.PI*(i/n));
			let y = w-r*Math.cos(2*Math.PI*(i/n));
			let fill = (i==0.0) ? "red" : "white";
			let circle = document.createElementNS(svgNamespace, "circle");
			circle.setAttribute("cx", x);
			circle.setAttribute("cy", y);
			circle.setAttribute("r", 10);
			circle.setAttribute("fill", fill);
			circle.setAttribute("stroke", "black");
			circle.setAttribute("stroke-width", "2");
			svg.appendChild(circle);
		}
		// draw ladybug
		let r2 = Math.min(w,h)*(0.9);
		let x2 = h+r2*Math.sin(0);
		let y2 = w-r2*Math.cos(0);
		let circle2 = document.createElementNS(svgNamespace, "circle");
		circle2.setAttribute("cx", x2);
		circle2.setAttribute("cy", y2);
		circle2.setAttribute("r", 10);
		circle2.setAttribute("fill", "red");
		circle2.setAttribute("stroke", "black");
		circle2.setAttribute("stroke-width", "2");
		svg.appendChild(circle2);
		for(let i=1.0; i<n; i++) {
			// draw number labels
			let r3 = Math.min(w,h)*(0.9);
			let x3 = h+r3*Math.sin(2*Math.PI*(i/n));
			let y3 = w-r3*Math.cos(2*Math.PI*(i/n));
			let text = document.createElementNS(svgNamespace, "text");
			text.setAttribute("x", x3-20);
			text.setAttribute("y", y3);
			text.setAttribute("fill", "black");
			text.setAttribute("font-size", "20");
			text.setAttribute("font-family", "Arial");
			text.textContent = results[i]+"%";
			svg.appendChild(text);
		}
	}
	updateImage1(numberOfPositions);
	function updateImage2(n,ladybug,filled) {
		let svg = document.getElementById("svg2");
		let width = 600;
		let height = 600;
		let w = width/2.0;
		let h = height/2.0;
		let r = Math.min(w,h)*(0.7);
		svg.setAttribute("width",width);
		svg.setAttribute("height",height);
		svg.replaceChildren(); // Clears all interior content
		let svgNamespace = "http://www.w3.org/2000/svg";
		for(let i=0.0; i<n; i++) {
			// draw clock positions
			let x = h+r*Math.sin(2*Math.PI*(i/n));
			let y = w-r*Math.cos(2*Math.PI*(i/n));
			let fill = filled[i] ? "red" : "white";
			let circle = document.createElementNS(svgNamespace, "circle");
			circle.setAttribute("cx", x);
			circle.setAttribute("cy", y);
			circle.setAttribute("r", 10);
			circle.setAttribute("fill", fill);
			circle.setAttribute("stroke", "black");
			circle.setAttribute("stroke-width", "2");
			svg.appendChild(circle);
		}
		// draw ladybug
		let r2 = Math.min(w,h)*(0.9);
		let x2 = h+r2*Math.sin(2*Math.PI*(ladybug/n));
		let y2 = w-r2*Math.cos(2*Math.PI*(ladybug/n));
		let circle2 = document.createElementNS(svgNamespace, "circle");
		circle2.setAttribute("cx", x2);
		circle2.setAttribute("cy", y2);
		circle2.setAttribute("r", 10);
		circle2.setAttribute("fill", "red");
		circle2.setAttribute("stroke", "black");
		circle2.setAttribute("stroke-width", "2");
		svg.appendChild(circle2);
	}
	function myClearTimeout() {
		if(timeoutID>0) {
			clearTimeout(timeoutID);
			timeoutID = -1;
		}
	}
	function mySetTimeout(a,b,c,d,e) {
		myClearTimeout();
		timeoutID = setTimeout(a,b,c,d,e);
	}
	function animateRandomExampleTimer(n,ladybug,filled) {
		if(ladybug==n) return;
		if(Math.random()>0.5) {
			ladybug = (ladybug+1)%n;
		} else {
			ladybug = (ladybug+n-1)%n;
		}
		filled[ladybug] = 1;
		updateImage2(n,ladybug,filled);
		let count = 0;
		for(let k=0; k<n; k++) {
			if(filled[k]) {
				count++;
			}
		}
		if(count==n) return;
		mySetTimeout(animateRandomExampleTimer,1000/n,n,ladybug,filled);
	}
	function animateRandomExample(n) {
		let ladybug = 0;
		let filled = [];
		for(let k=0; k<n; k++) {
			filled.push(0);
		}
		filled[0] = 1;
		updateImage2(n,ladybug,filled);
		mySetTimeout(animateRandomExampleTimer,1000/n,n,ladybug,filled);
	}
	animateRandomExample(numberOfPositions);
	function numberOfPositionsChanged(eventTargetValue) {
		numberOfPositions = eventTargetValue;
		let expectedValue = 1.0/(numberOfPositions-1);
		document.getElementById("estimated_expected_positional_probability").textContent = "Expected outcome: The probability of each position aside from the starting position being the final position is 1/(N-1) = 1/"+(numberOfPositions-1)+" = "+((100.0/(numberOfPositions-1)).toFixed(1))+"%";
		// TODO: the naming convention between different uses of N etc is confusing here
		updateImage1(numberOfPositions);
		animateRandomExample(numberOfPositions);
	}
	function numberOfPositionsChangedEvent(event) {
		// TODO: something about changing the number of positions is causing the animation to freak out
		// TODO: something about changing the number of positions is causing the simulated average calculation to freak out
		// TODO: provide button for the user to rerun animation without changing number of positions
		myClearTimeout();
		// convert to number to avoid very weird bugs
		numberOfPositionsChanged(Number(event.target.value));
	}
	function runExampleAgain() {
		animateRandomExample(numberOfPositions);
	}
</script>
</html>
